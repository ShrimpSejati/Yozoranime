<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Yozoranime</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <svg class="logo-moon" width="40" height="40" viewBox="0 0 48 48" fill="none">
            <defs>
              <linearGradient id="moonGrad" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#c4b5fd" />
                <stop offset="1" stop-color="#6c4bff" />
              </linearGradient>
            </defs>
            <path d="M30 6a18 18 0 1 0 12 30A15 15 0 0 1 30 6z" fill="url(#moonGrad)" />
            <path d="M36 9l1.2 2.8L40 13l-2.8 1.2L36 17l-1.2-2.8L32 13l2.8-1.2z" fill="#e9e4ff" />
          </svg>
          <div class="name">Yozoranime<small>夜空</small></div>
        </div>

        <nav class="side-nav">
          <button class="side-link active" data-view="home"><span class="ic" data-icon="home"></span> Beranda</button>
          <button class="side-link" data-view="search"><span class="ic" data-icon="search"></span> Cari</button>
          <button class="side-link" data-view="genres"><span class="ic" data-icon="grid"></span> Genre</button>
          <button class="side-link" data-view="schedule"><span class="ic" data-icon="calendar"></span> Jadwal Rilis</button>
          <button class="side-link" data-view="bookmarks"><span class="ic" data-icon="bookmarkStack"></span> Bookmark</button>
          <button class="side-link" data-view="history"><span class="ic" data-icon="history"></span> Riwayat</button>
          <button class="side-link" data-view="downloads"><span class="ic" data-icon="download"></span> Download</button>
          <button class="side-link" data-view="settings"><span class="ic" data-icon="settings"></span> Pengaturan</button>
        </nav>

        <div class="side-sky">
          <i class="shoot s1"></i><i class="shoot s2"></i><i class="shoot s3"></i>
          <p>Anime selalu lebih indah di bawah langit yang sama.</p>
          <span>— Yozoranime 夜空</span>
        </div>
      </aside>

      <div class="main-col">
        <header class="topbar">
          <form id="search-form" class="search-form">
            <span class="ic" data-icon="search"></span>
            <input id="search-input" type="text" placeholder="Cari anime, genre, atau judul…" />
            <span class="kbd">Ctrl K</span>
          </form>
          <div class="topbar-spacer"></div>
          <div class="notif-wrap">
            <button class="bell-btn" id="bell-btn"><span class="ic" data-icon="bell"></span><span class="notif-badge" id="notif-badge" style="display:none">0</span></button>
            <div class="notif-panel" id="notif-panel" style="display:none"></div>
          </div>
        </header>

        <main id="app-main"></main>
      </div>
    </div>

    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
